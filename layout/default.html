<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ page_title }}</title>
	<meta name="description" content="{{ description }}">
	<meta name="color-scheme" content="light dark">
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
	<link rel="stylesheet" href="/style.css">
	<script src="/main.js" defer></script>
	<meta property="og:title" content="{{ title }}">
	<meta property="og:description" content="{{ description }}">
	<meta name="language" content="ko">
</head>

<body>
	<a class="skip-link" href="#content">본문으로 건너뛰기</a>

	<header class="topbar">
		<a class="brand" href="/">atoz 문서</a>
		<button class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false">목록</button>
	</header>

	<div class="site">
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-head">
				<a class="brand" href="/">atoz 문서</a>
				<label class="search" for="search-input">
					<span class="visually-hidden">문서 검색</span>
					<input id="search-input" type="search" placeholder="검색" autocomplete="off" spellcheck="false" aria-controls="search-results">
					<kbd aria-hidden="true">/</kbd>
				</label>
			</div>
			<div class="search-results" id="search-results" role="listbox" aria-label="검색 결과" hidden></div>
			<nav class="sidebar-nav" aria-label="문서 목록">
				{{ sidebar }}
			</nav>
			<p class="sidebar-foot">
				<a class="icon-link" href="https://github.com/supatipanno5611/atoz" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
				</a>
				<a class="icon-link" href="https://buymeacoffee.com/supatipanno5611" target="_blank" rel="noopener" aria-label="Buy Me a Coffee로 후원하기" title="후원하기">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M6 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/></svg>
				</a>
				<a href="https://github.com/supatipanno5611/atoz/issues" target="_blank" rel="noopener">오류 제보</a>
			</p>
		</aside>
		<div class="scrim" hidden></div>

		<main class="doc" id="content">
			<header class="doc-head">
				{{ group }}
				<h1>{{ title }}</h1>
			</header>
			{{ page_toc }}
			<div class="doc-body">
				{{ content }}
				{{ prev_next }}
			</div>
		</main>
	</div>
</body>
</html>
